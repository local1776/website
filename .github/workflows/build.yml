# Builds www.local1776.org and publishes it to GitHub Pages (Ben, Nov 22 2026: launch prep).
# Runs on every push, every hour (so news headlines, YouTube videos, the Congress data and the lobbying sponsor lines stay
# current), when the Union App asks (repository_dispatch, e.g. a news story was published), and by hand (Actions tab → Run).
# The build is ONLINE (no --offline): it re-fetches the Congress members, Voteview, headlines and videos every run.
name: Build and Publish

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"          # every hour, at :17 past
  repository_dispatch:
    types: [publish]              # the Union App can trigger a rebuild
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # THE LAUNCH SWITCH: "0" = preview (noindex, robots.txt says keep out). Set to "1" at launch.
      L1776_LIVE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build the site
        run: node tools/build.mjs
      - name: Check the site's own links (a broken one stops the publish)
        run: node tools/check-links.mjs --internal --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
